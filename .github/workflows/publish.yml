name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - all
          - connection-health
          - nango
          - composio
          - pipedream
          - clerk
          - supabase
          - n8n
        default: "all"
      version:
        description: "Version bump type (current publishes the checked-in version)"
        required: true
        type: choice
        options:
          - current
          - patch
          - minor
          - major
          - prerelease
        default: "patch"
      tag:
        description: "NPM dist-tag"
        required: false
        type: choice
        options:
          - latest
          - next
          - beta
        default: "latest"
      expected_integrity:
        description: "Optional sha512 integrity of the reviewed artifact (one package only)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (do not actually publish)"
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-package
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Upgrade npm
        run: npm install -g npm@11.9.0

      - name: Build all packages
        run: npx turbo build

      - name: Resolve packages to publish
        id: resolve
        env:
          PACKAGE: ${{ inputs.package }}
          EXPECTED_INTEGRITY: ${{ inputs.expected_integrity }}
        run: |
          if [ "$PACKAGE" = "all" ]; then
            if [ -n "$EXPECTED_INTEGRITY" ]; then
              echo "An artifact integrity requires selecting one package." >&2
              exit 1
            fi
            echo "packages=connection-health nango composio pipedream clerk supabase n8n" >> "$GITHUB_OUTPUT"
          else
            case "$PACKAGE" in
              connection-health|nango|composio|pipedream|clerk|supabase|n8n) ;;
              *) echo "Unknown package." >&2; exit 1 ;;
            esac
            echo "packages=$PACKAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Check first-publish credential availability
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_BOOTSTRAP_TOKEN" ]; then
            echo "First-publish credential is configured for this repository."
          else
            echo "No first-publish credential is configured; publishing uses package-specific OIDC trust."
          fi

      - name: Version, verify artifact & publish
        env:
          PACKAGES: ${{ steps.resolve.outputs.packages }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          PUBLISH_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXPECTED_INTEGRITY: ${{ inputs.expected_integrity }}
        run: |
          for pkg in $PACKAGES; do
            npm run test --prefix "packages/$pkg"
            cd "packages/$pkg"
            if [ "$VERSION" != "current" ]; then
              npm version "$VERSION" --no-git-tag-version
            fi

            # Pin the packer to reproduce artifacts reviewed on developers' machines.
            # Publishing still uses npm 11 for the existing trusted-publisher OIDC flow.
            export PACK_JSON="$RUNNER_TEMP/npm-pack-$pkg.json"
            npx --yes --package=npm@10.9.7 -- npm pack --json --ignore-scripts > "$PACK_JSON"
            archive=$(node -p "JSON.parse(require('fs').readFileSync(process.env.PACK_JSON, 'utf8'))[0].filename")
            integrity=$(node -p "JSON.parse(require('fs').readFileSync(process.env.PACK_JSON, 'utf8'))[0].integrity")
            if [ -n "$EXPECTED_INTEGRITY" ] && [ "$EXPECTED_INTEGRITY" != "$integrity" ]; then
              echo "Packed artifact differs from the reviewed integrity; refusing publication." >&2
              exit 1
            fi
            echo "Verified artifact: $pkg $integrity"
            if [ "$DRY_RUN" = "true" ]; then
              npm publish "$archive" --ignore-scripts --dry-run --access public --tag "$PUBLISH_TAG"
            elif [ -n "$NPM_BOOTSTRAP_TOKEN" ] && [ "$VERSION" = "current" ] && [ "$pkg" = "connection-health" ] && [ "$(node -p "require('./package.json').version")" = "0.1.0" ]; then
              # Initial creation cannot rely on this new package's own OIDC trust.
              # Only the publish subprocess receives registry authentication.
              NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN" npm publish "$archive" --ignore-scripts --access public --provenance --tag "$PUBLISH_TAG"
            else
              npm publish "$archive" --ignore-scripts --access public --provenance --tag "$PUBLISH_TAG"
            fi
            cd ../..
          done

      - name: Commit version bumps
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.version != 'current'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add packages/*/package.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): bump ${{ github.event.inputs.package }} (${{ github.event.inputs.version }})"
            git push
          fi
